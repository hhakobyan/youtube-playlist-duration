<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #0f0f0f;
      --muted: #606060;
      --border: #e5e5e5;
      --track: #c4c4c4;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #212121;
        --text: #f1f1f1;
        --muted: #aaaaaa;
        --border: #3a3a3a;
        --track: #5a5a5a;
        --accent: #3b82f6;
      }
    }
    body {
      margin: 0;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
    }
    header img { width: 20px; height: 20px; }
    label.option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      cursor: pointer;
    }
    label.option + label.option { border-top: 1px solid var(--border); }
    .title { font-weight: 500; }
    .desc { color: var(--muted); font-size: 12px; }
    .switch { position: relative; flex: none; width: 36px; height: 20px; }
    .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--track);
      transition: background 0.15s;
      pointer-events: none;
    }
    .slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::after { transform: translateX(16px); }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { padding: 8px 16px 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <span>Playlist Duration &amp; Controls</span>
  </header>

  <label class="option">
    <span>
      <span class="title">Playlist total duration</span><br>
      <span class="desc">Show the total length after the playlist counter, e.g. 1 / 5 4:25:14</span>
    </span>
    <span class="switch">
      <input type="checkbox" data-setting="playlistDuration">
      <span class="slider"></span>
    </span>
  </label>

  <label class="option">
    <span>
      <span class="title">Controls on media keys</span><br>
      <span class="desc">Show the player controls and play/pause icon when you pause or play with earphones or media keys</span>
    </span>
    <span class="switch">
      <input type="checkbox" data-setting="mediaKeyControls">
      <span class="slider"></span>
    </span>
  </label>

  <footer>Changes apply immediately to open YouTube tabs.</footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
